name: lingzhu

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/1
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the public HTTPS origin}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DEMO_MODE: ${LINGZHU_DEMO_MODE:-true}
  LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
  LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
  DEEPSEEK_API_KEY: ${LINGZHU_DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DASHSCOPE_API_KEY: ${LINGZHU_DASHSCOPE_API_KEY:-}
  DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  ARK_API_KEY: ${LINGZHU_ARK_API_KEY:-}
  ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
  DOUBAO_MODEL: ${DOUBAO_MODEL:-}
  OPENAI_API_KEY: ${LINGZHU_OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  IMAGE_API_KEY: ${LINGZHU_IMAGE_API_KEY:-}
  IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
  IMAGE_MODEL: ${IMAGE_MODEL:-doubao-seedream-5-0-flash-260915}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${LINGZHU_S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${LINGZHU_S3_SECRET_ACCESS_KEY:-}
  S3_REGION: ${S3_REGION:-}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
  JIANYING_HELPER_URL: ${JIANYING_HELPER_URL:-https://ts.fyshark.com/#/cozeToJianyin}
  JIANYING_DRAFT_DIR: /app/apps/server/data/exports
  JIANYING_EXPORT_MODE: package
  JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-5}
  JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-30}
  JOB_STALE_SECONDS: ${JOB_STALE_SECONDS:-180}
  JOB_OUTBOX_POLL_SECONDS: ${JOB_OUTBOX_POLL_SECONDS:-10}
  JOB_OUTBOX_LOCK_SECONDS: ${JOB_OUTBOX_LOCK_SECONDS:-120}
  UPLOAD_MAX_CONCURRENCY: ${UPLOAD_MAX_CONCURRENCY:-4}
  AGENT_INPUT_TOKEN_BUDGET: ${AGENT_INPUT_TOKEN_BUDGET:-16000}
  AGENT_SUMMARY_TRIGGER_RATIO: ${AGENT_SUMMARY_TRIGGER_RATIO:-0.75}
  AGENT_RECENT_MESSAGE_COUNT: ${AGENT_RECENT_MESSAGE_COUNT:-8}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}

  api:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - app_data:/app/apps/server/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=${CELERY_CONCURRENCY:-2}"]
    environment: *app-environment
    volumes:
      - app_data:/app/apps/server/data
    depends_on:
      api:
        condition: service_healthy

  beat:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO"]
    environment: *app-environment
    volumes:
      - app_data:/app/apps/server/data
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  app_data:
